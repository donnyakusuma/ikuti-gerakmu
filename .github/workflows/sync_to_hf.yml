name: Sync to Hugging Face Space
# Keeps your Hugging Face Space running the latest code of this repo.
# The Space installs the package from GitHub through its requirements.txt, so on every
# push to main this workflow points requirements.txt at the pushed commit; Hugging Face
# then rebuilds the Space automatically. (Copying Sports2D/* into the Space root, as the
# original workflow did, would shadow the installed package and break `from Sports2D import Sports2D`.)
#
# Setup (Settings > Secrets and variables > Actions):
#   - secret   HUGGINGFACE_TOKEN : a Hugging Face token with write access
#   - variable HF_SPACE          : the Space id, e.g. "your-hf-username/ikuti-gerakmu"
# Create the Space by duplicating https://huggingface.co/spaces/DavidPagnon/sports2d
# (button "Duplicate this Space"). If the secret or variable is missing, the job is skipped.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check Hugging Face configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::HUGGINGFACE_TOKEN secret or HF_SPACE variable not set: skipping Hugging Face sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Point the Space at this commit
        if: steps.cfg.outputs.ok == 'true'
        run: |
          export GIT_LFS_SKIP_SMUDGE=1   # do not download the demo videos
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf_space
          cd hf_space
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          REQ="git+https://github.com/${{ github.repository }}.git@${{ github.sha }}#egg=ikuti-gerakmu"
          if [ -f requirements.txt ]; then
            # replace the line that installs Sports2D / ikuti-gerakmu, keep everything else
            grep -v -i -E '^[^#]*(sports2d|ikuti-gerakmu)' requirements.txt > requirements.new || true
            { echo "$REQ"; cat requirements.new; } > requirements.txt
            rm requirements.new
          else
            echo "$REQ" > requirements.txt
          fi
          git add requirements.txt
          git diff --cached --quiet && { echo "Space already up to date."; exit 0; }
          git commit -m "Sync from GitHub ${{ github.repository }}@${{ github.sha }}"
          git push "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
