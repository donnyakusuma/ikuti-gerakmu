name: Sync to Hugging Face Space
# Mirrors the Sports2D/ package folder to your Hugging Face Space on every push to main.
# Setup (Settings > Secrets and variables > Actions):
#   - secret   HUGGINGFACE_TOKEN : a Hugging Face write token
#   - variable HF_SPACE          : the Space id, e.g. "your-hf-username/ikuti-gerakmu"
# If either is missing, the job is skipped with a warning instead of failing.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Hugging Face configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::HUGGINGFACE_TOKEN secret or HF_SPACE variable not set: skipping Hugging Face sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to Hugging Face Space
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf_space
          cd hf_space
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          cp -r ../Sports2D/* .
          git add .
          git diff --cached --quiet && { echo "Nothing to sync."; exit 0; }
          git commit -m "Sync from GitHub ${{ github.sha }}"
          git push "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
