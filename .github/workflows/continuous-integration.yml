# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI (Win-MacOS-Ubuntu, Python 3.11-3.13)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'Content/**'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest,  macos-latest] #, macos-13] # opensim not supported on macos Intel AMD x64 beyond python 3.11
        python-version: ["3.11", "3.12", "3.13"] # dropped 3.10, not supported by opensim outside of conda

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # full history + tags so setuptools-scm computes the version

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install flake8 pytest
          uv pip install .   # install from the checkout (works for private repos too)
      
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run --no-project flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run --no-project flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv
                
      - name: Test with pytest
        env: 
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          KMP_DUPLICATE_LIB_OK: TRUE
        shell: bash
        run: |
          # Some GitHub Windows runners have CPUs that OpenVINO's native code does not support
          # ("Windows fatal exception: code 0xc000001d" = illegal instruction). That crash depends
          # on which machine the job lands on, so only in that case the tests are run once more.
          set +e
          uv run --no-project pytest -v Sports2D/Utilities/tests.py --capture=sys 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q "code 0xc000001d" pytest.log; then
            echo "::warning::OpenVINO illegal-instruction crash on this runner CPU; retrying the tests once."
            uv run --no-project pytest -v Sports2D/Utilities/tests.py --capture=sys
            status=$?
          fi
          exit $status
