# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package to PyPi upon release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
    - name: Checkout 
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history + tags so setuptools-scm computes the version
    - name: Check PyPI token
      id: token
      run: |
        if [ -z "$PYPI_API_TOKEN" ]; then
          echo "::warning::Secret PYPI_API_TOKEN is not set: building the package but skipping the PyPI upload."
          echo "present=false" >> "$GITHUB_OUTPUT"
        else
          echo "present=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools-scm
    - name: Build package
      run: python -m build
    - name: Upload built package as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish package
      if: steps.token.outputs.present == 'true'
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
